[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asset_manager"
version = "0.1.0"
description = "A unified, simulator-agnostic registry for robotics assets"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
dependencies = [
    "pyyaml>=5.4",
]

[tool.hatchling.build]
packages = ["src/asset_manager"]
